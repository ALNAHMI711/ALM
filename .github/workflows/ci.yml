name: YOW CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Portal/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall .
